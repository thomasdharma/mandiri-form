<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Akuisisi Merchant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f1f1;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 480px;
      margin: 40px auto;
      padding: 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .container img {
      max-width: 140px;
      display: block;
      margin: 0 auto 20px;
    }
    h2 {
      text-align: center;
      color: #004799;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: 600;
    }
    input[type="text"],
    input[type="file"],
    button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      background: #004799;
      color: white;
      font-weight: bold;
      border: none;
      margin-top: 16px;
    }
    #ocrResult, #submitResult {
      margin-top: 20px;
      background: #f8f8f8;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="assets/logo-mandiri.png" alt="Mandiri Logo" />

    <h2>Form Akuisisi + Lokasi (OCR)</h2>

    <form id="merchantForm">
      <label>Nama Toko:</label>
      <input type="text" name="nama" required />

      <label>Upload Foto GPS (overlay):</label>
      <input type="file" id="photo" accept="image/*" required />

      <label>Produk:</label>
      <input type="text" name="produk" required />

      <label>PIC:</label>
      <input type="text" name="pic" required />

      <!-- Hidden auto-extracted -->
      <input type="hidden" name="alamat" />
      <input type="hidden" name="lat" />
      <input type="hidden" name="lng" />

      <button type="submit">Kirim</button>
    </form>

    <div id="ocrResult">📸 OCR belum dijalankan.</div>
    <div id="submitResult"></div>
  </div>

  <script>
    const form = document.getElementById("merchantForm");
    const photoInput = document.getElementById("photo");
    const ocrResult = document.getElementById("ocrResult");
    const submitResult = document.getElementById("submitResult");

    photoInput.addEventListener("change", async () => {
      const file = photoInput.files[0];
      if (!file) return;

      ocrResult.textContent = "📷 Membaca teks dari gambar...";
      const image = URL.createObjectURL(file);

      const result = await Tesseract.recognize(image, 'eng');
      const text = result.data.text;
      ocrResult.textContent = text;

      const latMatch = text.match(/Lat\s*([0-9\.\-]+)/i);
      const lngMatch = text.match(/Long\s*([0-9\.\-]+)/i);
      const alamatMatch = text.match(/Jalan.*(?:Indonesia)?/i);

      form.lat.value = latMatch ? latMatch[1] : '';
      form.lng.value = lngMatch ? lngMatch[1] : '';
      form.alamat.value = alamatMatch ? alamatMatch[0] : '';
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitResult.textContent = "🔄 Mengirim data...";

      const data = new FormData(form);
      const response = await fetch(
        "https://script.google.com/macros/s/AKfycbzKH1hSlonqj_whU5p8Lk6-DMnWqMq7L3gJ0mmAeVXQVzn_nK3hbm1cMlrv4St5yKieqA/exec",
        {
          method: "POST",
          body: data,
        }
      );

      const resultText = await response.text();
      submitResult.textContent = `📬 ${resultText}`;

      if (response.ok) {
        form.reset();
        ocrResult.textContent = "📸 OCR belum dijalankan.";
      }
    });
  </script>
</body>
</html>
