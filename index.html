<!-- Ganti URL fetch ke milikmu -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById('merchantForm');
    const photoInput = document.getElementById('photo');
    const ocrResult = document.getElementById('ocrResult');

    photoInput.addEventListener('change', async () => {
      const file = photoInput.files[0];
      if (!file) return;

      const image = URL.createObjectURL(file);
      ocrResult.textContent = "🔍 Membaca teks dari foto...";

      const result = await Tesseract.recognize(image, 'eng');
      const text = result.data.text;
      ocrResult.textContent = text;

      const latMatch = text.match(/Lat\s*[:\-]?\s*([0-9\.\-]+)/i);
      const lngMatch = text.match(/Long\s*[:\-]?\s*([0-9\.\-]+)/i);
      const alamatMatch = text.match(/Jalan\s.+/i);

      form.lat.value = latMatch ? latMatch[1] : '';
      form.lng.value = lngMatch ? lngMatch[1] : '';
      form.alamat.value = alamatMatch ? alamatMatch[0] : '';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      console.log("Kirim data:", data);

      try {
        const response = await fetch(
          'https://script.google.com/macros/s/AKfycbRTnO3aqszDd2_IEsTd2gJJEfO4lGW87XE0rrpefP9v_a3skSXLcUxX2tkhpCEcv/exec', // GANTI URL INI
          {
            method: 'POST',
            mode: 'cors',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
          }
        );

        if (response.ok) {
          alert('✅ Data berhasil dikirim!');
          form.reset();
          ocrResult.textContent = '';
        } else {
          alert('❌ Gagal mengirim data!');
          console.error(await response.text());
        }
      } catch (err) {
        alert('⚠️ Terjadi kesalahan jaringan!');
        console.error(err);
      }
    });
  });
</script>
