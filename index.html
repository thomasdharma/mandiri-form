<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Akuisisi Merchant</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f1f1f1;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 12px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    #ocrResult {
      white-space: pre-wrap;
      background: #eee;
      padding: 10px;
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Form Upload Akuisisi + OCR Lokasi</h2>

  <form id="merchantForm">
    <label>Nama Toko:</label>
    <input type="text" name="namaToko" required>

    <label>Upload Foto GPS (dengan overlay):</label>
    <input type="file" id="photo" accept="image/*" required>

    <label>Produk:</label>
    <input type="text" name="produk" required>

    <label>PIC:</label>
    <input type="text" name="pic" required>

    <!-- Hidden fields dari hasil OCR -->
    <input type="hidden" name="alamat">
    <input type="hidden" name="lat">
    <input type="hidden" name="lng">

    <button type="submit">Kirim</button>
  </form>

  <div id="ocrResult"></div>

  <script>
    const form = document.getElementById('merchantForm');
    const photoInput = document.getElementById('photo');
    const ocrResult = document.getElementById('ocrResult');

    // Extract teks dari gambar
    photoInput.addEventListener('change', async () => {
      const file = photoInput.files[0];
      if (!file) return;

      const image = URL.createObjectURL(file);
      ocrResult.textContent = "Membaca teks dari foto...";

      const result = await Tesseract.recognize(image, 'eng');
      const text = result.data.text;
      ocrResult.textContent = text;

      // Regex parsing lokasi
      const latMatch = text.match(/Lat\s*[:\-]?\s*([0-9\.\-]+)/i);
      const lngMatch = text.match(/Long\s*[:\-]?\s*([0-9\.\-]+)/i);
      const alamatMatch = text.match(/Jalan\s.+/i);

      form.lat.value = latMatch ? latMatch[1] : '';
      form.lng.value = lngMatch ? lngMatch[1] : '';
      form.alamat.value = alamatMatch ? alamatMatch[0] : '';
    });

    // Submit ke Google Apps Script
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const plainData = Object.fromEntries(formData.entries());

      try {
        const response = await fetch('https://script.google.com/macros/s/AKfycbzKH1hSlonqj_whU5p8Lk6-DMnWqMq7L3gJ0mmAeVXQVzn_nK3hbm1cMlrv4St5yKieqA/exec', {
          method: 'POST',
          mode: 'cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(plainData)
        });

        if (response.ok) {
          alert('✅ Data berhasil dikirim!');
          form.reset();
          ocrResult.textContent = '';
        } else {
          alert('❌ Gagal mengirim data!');
          console.error(await response.text());
        }
      } catch (error) {
        alert('⚠️ Terjadi kesalahan jaringan!');
        console.error(error);
      }
    });
  </script>
</body>
</html>
